<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Private App</title>
  <style>
    :root { --bg:#f6f7fb; --card:#fff; --text:#1f2430; --muted:#6b7280; --accent:#4f46e5; --border:#e5e7eb; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0f1117; --card:#181b24; --text:#e8eaf0; --muted:#9aa1b2; --accent:#818cf8; --border:#2a2f3c; }
    }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }
    .hidden { display:none !important; }
    .center { min-height:100vh; display:grid; place-items:center; padding:16px; }
    .card { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:32px; width:100%; max-width:380px; text-align:center; }
    h1 { margin:0 0 8px; font-size:1.4rem; }
    p.muted { color:var(--muted); margin:0 0 24px; }
    button { font:inherit; cursor:pointer; border-radius:10px; border:1px solid var(--border); background:var(--card); color:var(--text); padding:10px 16px; }
    button.primary { background:#fff; color:#1f2430; display:inline-flex; gap:10px; align-items:center; font-weight:500; }
    button.primary:hover { box-shadow:0 1px 6px rgba(0,0,0,.2); }
    header { display:flex; justify-content:space-between; align-items:center; padding:12px 20px; background:var(--card); border-bottom:1px solid var(--border); }
    header .user { display:flex; align-items:center; gap:10px; }
    header img { width:32px; height:32px; border-radius:50%; }
    main { max-width:720px; margin:24px auto; padding:0 16px; }
    .error { color:#dc2626; margin-top:16px; font-size:.9rem; }
    form { display:flex; gap:8px; margin-bottom:16px; }
    input[type=text] { flex:1; font:inherit; padding:10px 12px; border-radius:10px; border:1px solid var(--border); background:var(--card); color:var(--text); }
    ul { list-style:none; padding:0; margin:0; }
    li { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:10px 14px; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center; }
    li button { padding:4px 10px; }
  </style>
</head>
<body>
  <!-- Signed-out view -->
  <div id="login-view" class="center hidden">
    <div class="card">
      <h1>My Private App</h1>
      <p class="muted">Sign in with your Google account to continue.</p>
      <button id="login-btn" class="primary">
        <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4.1 7.1-10.1 7.1-17.5z"/><path fill="#FBBC05" d="M10.5 28.7A14.5 14.5 0 0 1 9.5 24c0-1.6.3-3.2.8-4.7l-7.9-6.1A24 24 0 0 0 0 24c0 3.9.9 7.5 2.6 10.8l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.5-5.8c-2.1 1.4-4.9 2.3-8.4 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg>
        Sign in with Google
      </button>
      <div id="login-error" class="error"></div>
    </div>
  </div>

  <!-- Signed-in view -->
  <div id="app-view" class="hidden">
    <header>
      <strong>My Private App</strong>
      <div class="user">
        <img id="avatar" alt="" referrerpolicy="no-referrer">
        <span id="user-name"></span>
        <button id="logout-btn">Sign out</button>
      </div>
    </header>
    <main>
      <h2>Your notes</h2>
      <form id="note-form">
        <input type="text" id="note-input" placeholder="Add a note..." required maxlength="500">
        <button class="primary" type="submit" style="background:var(--accent);color:#fff;border:none">Add</button>
      </form>
      <ul id="notes"></ul>
      <div id="app-error" class="error"></div>
    </main>
  </div>

  <!-- Loading -->
  <div id="loading" class="center"><p class="muted">Loading…</p></div>

  <script type="module" src="app.js"></script>
</body>
</html>
